spring.application.name=qiuyun-tool-backend

# Server Configuration
server.port=8001

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://156.254.6.13:5432/qiuyun?currentSchema=qiuyun_tool&characterEncoding=UTF-8
spring.datasource.username=qiuyun
spring.datasource.password=qiuyun
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Redis Configuration
spring.data.redis.host=156.254.6.13
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=qiuyun


# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.dev.qiuyun.qiuyuntoolbackend=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Tool Configuration
# 文件存储根目录，默认使用用户主目录下的 qiuyun-tool/files
tool.file.storage-dir=${user.home}/qiuyun-tool/files
# 文件最大大小限制（200MB）
tool.file.max-size=209715200
# 文件保留时间（小时），默认24小时
tool.file.retention-hours=24

# 定时清理配置
tool.cleanup.enabled=true
# 每小时执行一次清理
tool.cleanup.cron=0 0 * * * ?

# File Upload Configuration
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# CORS Configuration
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With
cors.allow-credentials=true
